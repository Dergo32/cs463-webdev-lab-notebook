<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Exercise 02 - Form with CSS</title>

    <!-- don't forget to link the stylesheet -->
    <link rel="stylesheet" href="styles.css" />

  </head>
  <body class="form-body">
    <main>
      <section id="Roth_calculator" class="calc-form-section">

        <!-- header for page -->
        <header class="calc-header">
          <h1>Roth IRA Calculator</h1>
        </header>

        <!-- This is what happens when the user clicks the action button, usually to submit their input -->
        <form action="/submitform" class="ira-form">
          <!-- it is important to remember that, by default -->
          <!-- all elements in a form are inline elements that sit next to each other -->

          <!-- we use divs to divide the page into blocks that are not next to each other -->
          <div>
            <!-- labels in forms always need to be properly matched using the id attribute -->
            <!-- we put a break after the label to force a new line there -->
            <label class="left-align-label" for="balance_field">Balance ($)</label>

            <!-- the name attribute is similar to a variable name -->
            <!-- it identifies the data that the user inputs when it is sent -->
            <!-- the id attribute is to associate the field with the label -->
            <input class="form-field" type="text" name="balance" id="balance_field" />
          </div>
          <div>
            <label class="left-align-label" for="annual_field">Annual contribution (4)</label>
            <input class="form-field" type="text" name="annual_contribution" id="annual_field" />
          </div>

          <div>
              <!-- this is a radio button menu -->
            <fieldset class="radio-buttons">
              <!-- this is the prompt for the radio buttons -->
              <!-- the legend is always a child of the fieldset; it is the caption for the entire set -->
              <legend>Maximize contributions?</legend>

              <!-- the button goes first, then the label -->
              <!-- the value attribute is like a variable name -->
              <!-- it keeps track of which option the user picked -->
              <input type="radio" name="maximize" id="yes" value="yes" />
              <label for="yes">Yes</label>

              <!-- the name attribute makes the choices part of the same menu, so you can't choose both -->
              <input type="radio" name="maximize" id="no" value="no" />
              <label for="no">No</label>
            </fieldset>
          </div>
          <!-- this is specifically a number input -->
          <!-- name and id work the same as the other text boxes -->
          <div>
            <label class="left-align-label" for="rate_of_return">Expected rate of return (5)</label>

            <input class="form-field" type="number" name="rate_value" id="rate_of_return" />
          </div>

          <div>
            <label class="left-align-label" for="current_age">Current age</label>

            <input class="form-field" type="number" name="current_age_value" id="current_age" />
          </div>

          <div>
            <label class="left-align-label" for="retire_age">Retirement age</label>

            <input class="form-field" type="number" name="retire_value" id="retire_age" />
          </div>

          <div>
            <label class="left-align-label" for="tax_rate">Marginal tax rate (%)</label>

            <input class="form-field" type="number" name="tax_value" id="tax_rate" />
          </div>

          <div>
            <!-- Submit buttons must always have the type == submit -->
            <input type="submit" value="Calculate" />

            <!-- Reset buttons to clear the form must always have the type == reset -->
            <input type="reset" value="Reset" />
          </div>
        </form>

        <!-- this note goes outside of the form element -->
        <p>
          This exercise is a simplified version of the Roth IRA Calculator at
          <a href="https://www.calculator.net">Calculator.net</a>
        </p>
      </section>
    </main>
  </body>
</html>
