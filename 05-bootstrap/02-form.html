<!doctype html>

<!-- this is an example of a form styled using only bootstrap -->

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Exercise 02 - Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body class="bg-light">
    <!-- always remember Bootstrap is mobile first, so the mobile view is the default view -->

    <main class="d-flex align-items-center">
      <!-- This is what happens when the user clicks the action button, usually to submit their input -->
      <!-- the form is a container, but it looks like a card -->
      <!-- rounded adds rounded corners -->
      <form
        action="/submitform"
        class="container border border-2 bg-white rounded mt-5"
      >
        <!-- fs 2 is font size, m is margin -->
        <h1 class="text-center m-4 fs-2">Roth IRA Calculator</h1>

        <!-- each collection of label and input is in a form group -->
        <!-- each text box is a form control in bootstrap -->
        <div class="form-group p-2">
          <!-- labels in forms always need to be properly matched using the id attribute -->
          <!-- we put a break after the label to force a new line there -->
          <label class="left-align-label py-2" for="balance_field"
            >Balance ($)</label
          >

          <!-- the name attribute is similar to a variable name -->
          <!-- it identifies the data that the user inputs when it is sent -->
          <!-- the id attribute is to associate the field with the label -->
          <input
            class="form-control"
            type="text"
            name="balance"
            id="balance_field"
          />
        </div>

        <!-- annual contribution field -->
        <div class="form-group p-2">
          <label class="left-align-label py-2" for="annual_field"
            >Annual contribution ($)</label
          >
          <input
            class="form-control"
            type="text"
            name="annual_contribution"
            id="annual_field"
          />
        </div>

        <!-- bootstrap radio buttons -->
        <!-- this is still a fieldset because we need a legend -->
        <fieldset class="form-group p-2">
          <legend class="col-form-label">Maximize contributions?</legend>

          <!-- each button and label pair goes in a form check div -->
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="maximize"
              id="yes"
              value="yes"
            />
            <label class="form-check-label" for="yes">Yes</label>
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="maximize"
              id="no"
              value="no"
            />
            <label class="form-check-label" for="no">No</label>
          </div>
        </fieldset>

        <!-- this is specifically a number input -->
        <!-- name and id work the same as the other text boxes -->
        <div class="form-group p-2">
          <label class="left-align-label py-2" for="rate_of_return"
            >Expected return (%)</label
          >

          <input
            class="form-control"
            type="number"
            name="rate_value"
            id="rate_of_return"
          />
        </div>

        <div class="form-group p-2">
          <label class="left-align-label py-2" for="current_age"
            >Current age</label
          >

          <input
            class="form-control"
            type="number"
            name="current_age_value"
            id="current_age"
          />
        </div>

        <div class="form-group p-2">
          <label class="left-align-label py-2" for="retire_age"
            >Retirement age</label
          >

          <input
            class="form-control"
            type="number"
            name="retire_value"
            id="retire_age"
          />
        </div>

        <div class="form-group p-2 mb-3">
          <label class="left-align-label py-2" for="tax_rate"
            >Tax rate (%)</label
          >

          <input
            class="form-control"
            type="number"
            name="tax_value"
            id="tax_rate"
          />
        </div>

        <!-- there is a trick to make the buttons look the way we want -->
        <!-- set each button to w-100 to make them expand to the max width -->
        <div class="container">
          <div class="row">
            <!-- we don't use columns here, we use a single d flex container so we can specify the gap -->
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary w-100">
                Calculate
              </button>
              <button type="reset" class="btn btn-outline-secondary w-100">
                Reset
              </button>
            </div>
          </div>
        </div>

        <!-- the form note at the bottom -->
        <p class="py-4 px-3 text-secondary form-note">
          This exercise is a simplified version of the Roth IRA Calculator at
          <a href="https://www.calculator.net">Calculator.net</a>
        </p>
      </form>
    </main>
  </body>
</html>
